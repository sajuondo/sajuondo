<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>사주온도 — 배포 진단</title>
<style>
  body { font-family: -apple-system, sans-serif; padding: 40px; background: #f8f8f8; max-width: 800px; margin: 0 auto; }
  h1 { font-size: 22px; }
  .check { padding: 12px 16px; border-radius: 8px; margin: 8px 0; font-size: 14px; }
  .ok { background: #d4f5e0; color: #0a5d2d; }
  .fail { background: #f7d4d4; color: #8a1a1a; }
  .pending { background: #f0f0f0; color: #666; }
  code { background: rgba(0,0,0,.06); padding: 2px 6px; border-radius: 4px; font-size: 12px; }
  pre { background: #1e1e1e; color: #d4d4d4; padding: 12px; border-radius: 6px; overflow-x: auto; font-size: 12px; }
</style>
</head>
<body>
<h1>🔍 사주온도 배포 진단</h1>
<p>각 항목이 모두 ✅로 떠야 사이트가 정상 작동합니다.</p>
<div id="results"></div>

<h2 style="margin-top:32px;font-size:16px;">현재 위치 정보</h2>
<pre id="location"></pre>

<script>
const results = document.getElementById('results');
const loc = document.getElementById('location');
loc.textContent = `현재 URL: ${location.href}\n호스트: ${location.host}\n경로: ${location.pathname}`;

function add(label, status, detail) {
  const div = document.createElement('div');
  div.className = 'check ' + status;
  const icon = status === 'ok' ? '✅' : status === 'fail' ? '❌' : '⏳';
  div.innerHTML = `${icon} <strong>${label}</strong>${detail ? '<br><small>' + detail + '</small>' : ''}`;
  results.appendChild(div);
  return div;
}

async function checkFile(path, label) {
  const item = add(label, 'pending', `<code>${path}</code> 확인 중...`);
  try {
    const r = await fetch(path);
    if (r.ok) {
      const size = r.headers.get('content-length') || (await r.text()).length;
      item.className = 'check ok';
      item.innerHTML = `✅ <strong>${label}</strong><br><small><code>${path}</code> · ${size} bytes</small>`;
      return true;
    } else {
      item.className = 'check fail';
      item.innerHTML = `❌ <strong>${label}</strong><br><small><code>${path}</code> · HTTP ${r.status}</small>`;
      return false;
    }
  } catch(e) {
    item.className = 'check fail';
    item.innerHTML = `❌ <strong>${label}</strong><br><small><code>${path}</code> · ${e.message}</small>`;
    return false;
  }
}

async function checkScript(url, label, globalName) {
  return new Promise(resolve => {
    const item = add(label, 'pending', `${url} 로딩 중...`);
    const s = document.createElement('script');
    s.src = url;
    s.onload = () => {
      if (window[globalName]) {
        item.className = 'check ok';
        item.innerHTML = `✅ <strong>${label}</strong><br><small>전역 객체 <code>window.${globalName}</code> 정상</small>`;
        resolve(true);
      } else {
        item.className = 'check fail';
        item.innerHTML = `❌ <strong>${label}</strong><br><small>스크립트는 로드됐지만 <code>window.${globalName}</code>가 없음</small>`;
        resolve(false);
      }
    };
    s.onerror = () => {
      item.className = 'check fail';
      item.innerHTML = `❌ <strong>${label}</strong><br><small>${url} 로드 실패 (네트워크 또는 CORS)</small>`;
      resolve(false);
    };
    document.head.appendChild(s);
  });
}

(async () => {
  // 1. CSS 파일
  await checkFile('./shared/design.css', '디자인 CSS 파일');

  // 2. 엔진 JS
  await checkFile('./shared/saju-engine.js', '만세력 엔진 JS');

  // 3. 인증 JS
  await checkFile('./shared/saju-auth.js', '인증 JS');

  // 4. Supabase CDN
  await checkScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2', 'Supabase CDN', 'supabase');

  // 5. 페이지 파일들
  await checkFile('./index.html', '메인 페이지');
  await checkFile('./salon.html', '온도살롱 페이지');
  await checkFile('./report.html', '리포트 페이지');

  // 6. 통합 테스트: saju-auth가 SajuAuth/renderAuthChip을 만드는지
  const item = add('saju-auth.js 통합 동작', 'pending', '');
  const authScript = document.createElement('script');
  authScript.src = './shared/saju-auth.js';
  authScript.onload = () => {
    setTimeout(() => {
      if (window.SajuAuth && window.renderAuthChip && window.SajuStore) {
        item.className = 'check ok';
        item.innerHTML = `✅ <strong>saju-auth.js 통합 동작</strong><br><small>SajuAuth, SajuStore, renderAuthChip 모두 전역 등록됨</small>`;
      } else {
        const missing = [];
        if (!window.SajuAuth) missing.push('SajuAuth');
        if (!window.SajuStore) missing.push('SajuStore');
        if (!window.renderAuthChip) missing.push('renderAuthChip');
        item.className = 'check fail';
        item.innerHTML = `❌ <strong>saju-auth.js 통합 동작</strong><br><small>전역에 없는 것: ${missing.join(', ')}</small>`;
      }
    }, 200);
  };
  authScript.onerror = () => {
    item.className = 'check fail';
    item.innerHTML = `❌ <strong>saju-auth.js 통합 동작</strong><br><small>스크립트 로드 실패</small>`;
  };
  document.head.appendChild(authScript);
})();
</script>
</body>
</html>
