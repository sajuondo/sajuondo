<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>씨앗 글 발행 도구 — 사주온도 (관리자용)</title>
<link rel="stylesheet" href="./shared/design.css">
<style>
  body { padding: 40px 24px; max-width: 900px; margin: 0 auto; }
  h1 { font-family: 'DM Serif Display', serif; font-size: 32px; margin-bottom: 8px; }
  .desc { color: var(--ink-3); margin-bottom: 32px; line-height: 1.7; font-size: 14px; }
  .desc strong { color: var(--ink); }
  .login-area { background: var(--bg-2); padding: 20px; border-radius: 12px; margin-bottom: 32px; display: flex; align-items: center; justify-content: space-between; }
  .login-area button { padding: 10px 20px; background: var(--ink); color: var(--cream); border-radius: 999px; font-size: 13px; cursor: pointer; }
  .seed-row {
    display: grid;
    grid-template-columns: 80px 1fr auto;
    gap: 12px;
    align-items: center;
    padding: 14px 16px;
    background: rgba(255,255,255,.5);
    border: 1px solid var(--line);
    border-radius: 10px;
    margin-bottom: 8px;
    font-size: 13px;
  }
  .seed-row .room-tag {
    font-family: 'DM Serif Display', serif;
    font-style: italic;
    font-size: 12px;
    color: var(--mint-dark);
    letter-spacing: .04em;
  }
  .seed-row .title {
    font-weight: 500;
    color: var(--ink);
  }
  .seed-row .excerpt {
    font-size: 11px;
    color: var(--ink-3);
    margin-top: 2px;
  }
  .seed-row .status {
    font-family: 'DM Serif Display', serif;
    font-style: italic;
    font-size: 11px;
    color: var(--ink-4);
    min-width: 60px;
    text-align: right;
  }
  .seed-row .status.done { color: var(--mint-dark); }
  .seed-row .status.fail { color: var(--fire); }
  .controls { display: flex; gap: 12px; margin: 32px 0 24px; align-items: center; }
  .controls button {
    padding: 14px 28px;
    background: var(--ink);
    color: var(--cream);
    border-radius: 999px;
    font-size: 13px;
    cursor: pointer;
    letter-spacing: .04em;
  }
  .controls button:disabled { opacity: .4; cursor: not-allowed; }
  .controls .note { color: var(--ink-3); font-size: 12px; }
  .danger-btn { background: transparent !important; color: var(--fire) !important; border: 1px solid var(--fire); }
  .summary { padding: 16px; background: rgba(0,201,167,.06); border-radius: 8px; margin-bottom: 24px; font-size: 13px; color: var(--ink-2); line-height: 1.7; }
  .summary strong { color: var(--ink); }
</style>
</head>
<body>

<h1>씨앗 글 발행 도구</h1>
<p class="desc">
  선희, 이 도구는 <strong>일회용 관리자 페이지</strong>예요.<br>
  살롱 각 방에 미리 작성된 30개 글을 본인 일간/온도로 한 번에 발행할 수 있어요.<br>
  발행 후엔 GitHub에서 이 파일(<code>_seed.html</code>)을 <strong>삭제</strong>해주세요.
</p>

<div class="login-area" id="login-area">
  <div id="login-status">로그인 확인 중...</div>
  <button id="login-btn" style="display:none;" onclick="SajuAuth.signInWithGoogle()">Google 로그인</button>
</div>

<div class="summary" id="summary">
  <strong>발행 예정:</strong> 일간 팀 20개 (각 방 2개) + 고민방 5개 (익명) + 자유게시판 5개 = <strong>총 30개</strong>
</div>

<div class="controls">
  <button id="btn-publish" disabled>✦ 30개 글 일괄 발행</button>
  <button id="btn-clear" class="danger-btn" disabled>발행한 글 모두 삭제 (취소용)</button>
  <span class="note">발행은 1초 간격으로 천천히 진행돼요. 중간에 닫지 마세요.</span>
</div>

<div id="seed-list"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./shared/saju-auth.js"></script>
<script>
/* ── 씨앗 글 데이터 ── */

  // 일간 팀 (10개 × 2 = 20개)
  { room_type: 'ilgan', room_value: 'gap', title: '갑목 일주, 진짜 다 비슷한가요?', content: '갑목이라고 다 같은 갑목이 아닌 것 같아요. 같은 일주끼리는 어떤 공통점이 있다고 느끼시나요? 저는 결정해야 할 때 일단 부딪혀보는 편인데, 다른 갑목 분들도 그러신가요?' },
  { room_type: 'ilgan', room_value: 'gap', title: '직업 바꾸기, 갑목한테 잘 맞는 시기가 있나요', content: '5년차 직장인인데 요즘 자꾸 다른 길이 그려져요. 갑목은 한 우물 파는 게 좋다는 말도 있고, 새 분야 개척하는 게 잘 맞다는 말도 있는데 경험 있으신 분 계신가요.' },

  { room_type: 'ilgan', room_value: 'eul', title: '을목 일주가 인간관계에서 자주 듣는 말', content: '"착하다"는 말을 너무 많이 들어요. 좋은데 가끔 무겁기도 해요. 다른 을목 분들도 비슷한가요? 어떻게 균형 잡으시는지 궁금해요.' },
  { room_type: 'ilgan', room_value: 'eul', title: '을목한테 가장 좋은 환경은', content: '월지가 뭐냐에 따라 다르겠지만, 사주적으로 을목이 빛나는 환경이 따로 있다고 들었어요. 어떤 분야에서 일하시는 을목 분들이 만족도 높으신지 듣고 싶어요.' },

  { room_type: 'ilgan', room_value: 'byeong', title: '병화는 정말 다 외향적인가요?', content: '저는 병화인데 내향적이에요. 사람들 많은 자리는 부담스럽고 혼자 있을 때 충전돼요. 책에서 본 병화 설명이랑 안 맞는 것 같은데, 비슷한 분 계신가요?' },
  { room_type: 'ilgan', room_value: 'byeong', title: '병화 일간의 연애 스타일', content: '시작할 땐 활활 타다가 식어버린 적이 있어서 고민이에요. 병화는 원래 그런 건지, 아니면 제가 사람을 잘못 만나는 건지... 다른 병화들은 어떠신가요.' },

  { room_type: 'ilgan', room_value: 'jeong', title: '정화 일주, 섬세하다는 말 듣고 사세요?', content: '주변 사람들 감정을 너무 잘 읽어서 가끔 지쳐요. 정화의 특징인 건지, 그냥 제 성격인 건지 궁금해서요. 다른 정화 분들 어떻게 지내시는지 듣고 싶어요.' },

  { room_type: 'ilgan', room_value: 'mu', title: '무토 일주, 흔들리지 않는다는 말 진짜인가요', content: '주변에서 차분하다는 말은 자주 듣는데 속으로는 불안한 게 많아요. 겉으로 잘 안 드러나는 것뿐인지... 무토 분들은 어떠세요?' },
  { room_type: 'ilgan', room_value: 'mu', title: '무토 + 식상 강한 사주, 어떻게 살고 계세요?', content: '식상이 발달한 무토라는 얘기를 들었는데, 안정과 표현 욕구가 동시에 있어서 헷갈려요. 비슷한 구조 가지신 분 어떻게 풀어가시는지요.' },

  { room_type: 'ilgan', room_value: 'gi', title: '기토는 왜 다 잘 들어줘요?', content: '친구들이 저한테 자꾸 고민을 털어놓아요. 좋은데 가끔은 받기만 하는 기분이 들 때도 있어요. 기토 일주는 다 비슷한가요?' },

  { room_type: 'ilgan', room_value: 'im', title: '임수 + 식신 강한 사주의 표현력', content: '글쓰기나 말하기로 풀어내는 게 잘 맞다는 분석을 받았어요. 비슷한 구조 가지신 분 어떤 일 하시는지 궁금해요.' },

  { room_type: 'ilgan', room_value: 'gye', title: '계수에게 좋은 환경의 사람들', content: '계수는 어떤 사람들과 함께 있을 때 잘 풀린다고 느끼세요? 저는 좀 차분한 사람들이랑 있을 때 편한데, 다른 계수 분들은 어떠신지요.' },

  // 고민방 익명 (5개)
  { room_type: 'topic', room_value: 'love', title: '5년 만난 사람이랑 헤어진 후 사주를 봤더니', content: '사주적으로 너무 안 맞는 조합이라고 들었어요. 진작 알았으면 덜 아팠을지, 아니면 그래도 가야 할 길이었을지 모르겠어요. 비슷한 경험 있으신 분 있나요.', anon: true },
  { room_type: 'topic', room_value: 'career', title: '관성이 약한데 회사 생활 너무 힘들어요', content: '대운에서 관운이 안 좋다는 얘기를 들었어요. 사주에 휘둘리지 않으려고 하는데 진짜 매일이 버겁네요. 관 약한 분들 어떻게 버티세요.', anon: true },
  { room_type: 'topic', room_value: 'money', title: '재성 충이 들어왔어요, 진짜 조심해야 하나요', content: '올해 재충이 들어왔다는 풀이를 받았어요. 큰 결정 미루고 있는데 너무 소극적인 건 아닐까 싶기도 하고요. 비슷한 시기 지나신 분 조언 부탁드려요.', anon: true },
  { room_type: 'topic', room_value: 'health', title: '편관 강하고 인성 약한 사주, 번아웃 자주 와요', content: '책임감은 강한데 받쳐줄 인성이 부족하다는 풀이를 들었어요. 진짜로 번아웃이 자주 와요. 비슷한 구조 가지신 분 어떻게 케어하세요.', anon: true },
  { room_type: 'topic', room_value: 'family', title: '어머니랑 사주적으로 안 맞는다는 말 듣고', content: '같이 살면서 자꾸 부딪혀요. 사주풀이로 일지 충이라는 얘기를 들었는데, 받아들이는 게 맞는지 거리를 둬야 하는지 모르겠어요.', anon: true },

  // 자유 게시판 (5개)
  { room_type: 'free', room_value: 'free', title: '사주 보러 가기 전에 알아두면 좋은 것', content: '여러 명한테 사주를 봤는데, 사람마다 해석이 달랐어요. 그래도 공통적으로 나온 부분들은 신뢰하게 되더라구요. 다들 어떤 기준으로 받아들이세요?' },
  { room_type: 'free', room_value: 'free', title: '사주 공부 어디서부터 시작하면 좋을까요', content: '재미로 보다가 좀 깊이 알고 싶어졌어요. 책 추천이나 강의 추천 있으면 공유해주세요. 명리학 입문자입니다.' },
  { room_type: 'free', room_value: 'free', title: 'MBTI보다 사주가 더 잘 맞는 것 같아요', content: 'MBTI는 시기에 따라 결과가 바뀌는데 사주는 안 바뀌잖아요. 그래서 더 본질적으로 느껴져요. 다들 어떻게 생각하세요?' },
  { room_type: 'free', room_value: 'free', title: '사주온도 사이트 좋네요', content: '디자인 깔끔하고 분석도 자세해서 좋아요. 살롱도 새로 생겼다고 해서 들렀어요. 다들 반가워요.' },
  { room_type: 'free', room_value: 'free', title: '오늘 일진 보고 출근하는 거 의외로 좋더라구요', content: '아침에 오늘 운세를 짧게 보고 시작하면 마음가짐이 달라져요. 너무 의존하지 않으면서 가볍게 참고하는 정도가 딱 좋은 것 같아요.' }
];

/* ── DOM 렌더링 ── */
const TEAM_LABELS = {
  'ilgan:gap': '甲 갑목', 'ilgan:eul': '乙 을목',
  'ilgan:byeong': '丙 병화', 'ilgan:jeong': '丁 정화',
  'ilgan:mu': '戊 무토', 'ilgan:gi': '己 기토',
  'ilgan:gyeong': '庚 경금', 'ilgan:sin': '辛 신금',
  'ilgan:im': '壬 임수', 'ilgan:gye': '癸 계수',
  'topic:love': '💗 연애', 'topic:career': '💼 진로',
  'topic:money': '💰 돈', 'topic:health': '🌿 건강', 'topic:family': '🏠 가족',
  'free:free': '📖 자유'
};

function renderSeedList() {
  const list = document.getElementById('seed-list');
  list.innerHTML = SEEDS.map((s, i) => {
    const key = `${s.room_type}:${s.room_value}`;
    const label = TEAM_LABELS[key] || key;
    return `
      <div class="seed-row" id="seed-${i}">
        <div class="room-tag">${label}</div>
        <div>
          <div class="title">${s.title}</div>
          <div class="excerpt">${s.content.slice(0, 60)}...${s.anon ? ' · 익명' : ''}</div>
        </div>
        <div class="status" id="status-${i}">대기</div>
      </div>
    `;
  }).join('');
}

/* ── 로그인 상태 확인 ── */
let publishedIds = [];

async function checkLogin() {
  const statusEl = document.getElementById('login-status');
  const loginBtn = document.getElementById('login-btn');
  const publishBtn = document.getElementById('btn-publish');
  const clearBtn = document.getElementById('btn-clear');

  // Supabase 로딩 대기
  for (let i = 0; i < 50; i++) {
    if (window.supabase && SajuAuth.client) break;
    await new Promise(r => setTimeout(r, 100));
  }

  const user = await SajuAuth.getUser();
  if (!user) {
    statusEl.textContent = '로그인이 필요해요. 본인 Google 계정으로 로그인하세요.';
    loginBtn.style.display = 'inline-block';
    return;
  }

  const saju = SajuStore.load();
  if (!saju || !saju.iljuKr) {
    statusEl.innerHTML = `<span style="color:var(--fire);">먼저 메인 페이지에서 사주 분석을 해주세요.</span> <a href="./index.html">분석하기 →</a>`;
    return;
  }

  // 닉네임 확인
  const nick = await SajuAuth.ensureNickname();
  if (!nick) {
    const newNick = prompt('아직 닉네임이 없어요. 닉네임을 입력해주세요 (2~16자):');
    if (newNick) {
      try {
        await SajuAuth.setNickname(newNick);
      } catch (e) {
        alert(e.message);
        return;
      }
    }
  }

  statusEl.innerHTML = `로그인됨: <strong>${user.email}</strong> · 닉네임: <strong>${nick || newNick}</strong> · 일주: <strong>${saju.iljuKr}</strong> · 온도: <strong>${saju.temperature}°c</strong>`;
  publishBtn.disabled = false;
  clearBtn.disabled = false;
}

/* ── 일괄 발행 ── */
async function publishAll() {
  const publishBtn = document.getElementById('btn-publish');
  publishBtn.disabled = true;

  const user = await SajuAuth.getUser();
  const saju = SajuStore.load();
  const nick = await SajuAuth.ensureNickname();

  publishedIds = [];

  for (let i = 0; i < SEEDS.length; i++) {
    const s = SEEDS[i];
    const statusEl = document.getElementById(`status-${i}`);
    statusEl.textContent = '발행 중...';

    try {
      const { data, error } = await SajuAuth.client.from('posts').insert({
        user_id: user.id,
        nickname: s.anon ? '익명' : nick,
        ilju_kr: s.anon ? null : saju.iljuKr,
        temperature: s.anon ? null : saju.temperature,
        room_type: s.room_type,
        room_value: s.room_value,
        title: s.title,
        content: s.content,
        is_anonymous: !!s.anon
      }).select().single();

      if (error) throw error;
      publishedIds.push(data.id);
      statusEl.textContent = '✓ 발행';
      statusEl.className = 'status done';
    } catch (e) {
      console.error(e);
      statusEl.textContent = '✗ 실패';
      statusEl.className = 'status fail';
    }

    // 1초 대기 (Supabase rate limit 회피 + 시각적 진행감)
    await new Promise(r => setTimeout(r, 1000));
  }

  alert(`발행 완료! ${publishedIds.length}개 글이 발행되었습니다.\n살롱에서 확인해보세요.\n\n작업 끝나면 _seed.html 파일을 GitHub에서 삭제해주세요.`);
}

/* ── 발행한 글 삭제 (취소용) ── */
async function clearPublished() {
  if (publishedIds.length === 0) {
    alert('이번 세션에서 발행한 글이 없어요.');
    return;
  }
  if (!confirm(`이번에 발행한 ${publishedIds.length}개 글을 정말 삭제할까요?`)) return;

  for (const id of publishedIds) {
    try {
      await SajuAuth.client.from('posts').delete().eq('id', id);
    } catch (e) { console.error(e); }
  }
  alert('삭제 완료');
  publishedIds = [];
}

/* ── 초기화 ── */
renderSeedList();
checkLogin();
document.getElementById('btn-publish').addEventListener('click', publishAll);
document.getElementById('btn-clear').addEventListener('click', clearPublished);
</script>

</body>
